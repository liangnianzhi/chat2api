name: build

# push 到 main 时自动构建、测试并推送 latest。
# PR 也会构建并测试（不推送）；workflow_dispatch 可手动重建。
#
# 脚本一律用解释器显式调用（sh/bash/node ...），不依赖工作区里的可执行位：
# git 里记的 mode 和磁盘上的 mode 可以不一致（本仓库就踩过：测试脚本在
# git 里是 100644，Windows 工作区里是 755，于是本地全绿、CI 上 exit 126）。
# 这也是 lint 自己的"入口必须可执行"检查保留的意义：它查的是 git mode。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_REF: ghcr.nju.edu.cn/${{ github.repository }}:latest
  CHAT2API_REF: ${{ github.ref_name }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 报一下解释器版本，失败时好判断是谁的问题：
      #   * lint 自己必须能在 dash 下跑（下方用 sh 调它，跟"被随便谁调用"等价）；
      #   * tests/smoke.sh 是 bash 脚本，lint 按 shebang 分流才用 bash -n 判它。
      - name: Shells
        run: |
          sh --version 2>&1 | head -1 || true
          readlink -f /bin/sh || true
          bash --version | head -1

      # lint 需要 node（"Node syntax" 与 docs_claims.js 两段）。没有 node 时
      # lint 会明确报 FAIL，不会再静默跳段。版本跟镜像一致（node:20-alpine）。
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # tests/lint.sh covers what used to be two hand-written steps, and more:
      #   - LF-only line endings for every text file (catches a CRLF checkout,
      #     which silently breaks the shebang of entrypoint.sh inside the image)
      #   - no UTF-8 BOM on scripts
      #   - shell syntax on every *.sh, judged by the interpreter its shebang
      #     declares; node --check on every *.js (no hand-kept list, so a new
      #     shim/*.js can never be silently left unchecked)
      #   - the executable bit on the entrypoints
      #
      # 用 sh 调 lint，而不是 bash：lint 的契约是"任何 POSIX sh 都能跑"，
      # 而 CI 若用 bash 调它，bash 专有语法就永远暴露不了——上一轮红了一整天
      # 正是这么来的（脚本里写了 <<<，bash 能解析，dash 连解析都不做）。
      # 结果写进 job summary：拿不到 job log 时也能看到是哪一条在报错。
      - name: Repo lint
        run: |
          OUT="$RUNNER_TEMP/lint.out"
          # 这里的 bash 只负责管上面那个管道；lint 自己必须由 sh(dash) 跑。
          set -o pipefail
          sh tests/lint.sh 2>&1 | tee "$OUT" || true
          ec="${PIPESTATUS[0]}"
          # 拿不到 job log（匿名 403），所以把每条 FAIL/ERROR 转成 ::error 注解。
          # 注解挂在本次 run 的 check-run 上，匿名可读：
          #   GET /repos/{repo}/check-runs/{id}/annotations
          grep -n -E 'FAIL|ERROR' "$OUT" | head -30 | while IFS= read -r r; do
            echo "::error title=lint::${r//'%'/'%25'}"
          done || true
          {
            echo '### Repo lint'
            echo
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$ec"

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # lint.sh 现在声明 /bin/sh，也纳入检查；auth_probe.sh 是给容器里跑的探针。
          shellcheck --severity=error \
            tests/lint.sh tests/smoke.sh deploy.sh shim/entrypoint.sh tests/auth_probe.sh

  build-test-publish:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      # 上游版本对比：把「本次实际用到的上游版本」与 UPSTREAM.lock 记录的基线
      # 对比，写进 job summary。上游更新不等于一定出错，但需要人知道。
      #
      # 这一段不参与构建成败：它查询的是别人的仓库，限流、超时、网络抖动都会发生，
      # 而这些都不是本仓库的问题。查询失败只写一行提示，构建继续。
      - name: Compare upstream version against the baseline
        id: upstream
        continue-on-error: true
        run: |
          up_repo="$(sed -n 's/^repo=//p' UPSTREAM.lock)"
          base_ver="$(sed -n 's/^version=//p' UPSTREAM.lock)"
          base_sha="$(sed -n 's/^commit=//p' UPSTREAM.lock)"

          head_sha="$(curl -fsS "https://api.github.com/repos/${up_repo}/commits/main" \
            -H 'Accept: application/vnd.github+json' | grep -oE '"sha": *"[0-9a-f]{40}"' | head -1 | grep -oE '[0-9a-f]{40}')" || true
          head_ver="$(curl -fsS "https://raw.githubusercontent.com/${up_repo}/main/package.json" \
            | grep -oE '"version": *"[^"]+"' | head -1 | sed 's/.*"version": *"//;s/"//')" || true
          head_sha="${head_sha:-unknown}"
          head_ver="${head_ver:-unknown}"

          echo "baseline: ${base_ver} (${base_sha})"
          echo "upstream: ${head_ver} (${head_sha})"

          {
            echo '### Upstream version'
            echo
            echo "| | version | commit |"
            echo "|---|---|---|"
            echo "| baseline (UPSTREAM.lock) | \`${base_ver}\` | \`${base_sha}\` |"
            echo "| upstream main now | \`${head_ver}\` | \`${head_sha}\` |"
            echo
            if [ "$head_sha" = "unknown" ]; then
              echo '上游版本查询失败（限流或网络问题），本次跳过对比；构建不受影响。'
            elif [ "$head_sha" != "$base_sha" ]; then
              echo "**上游有更新。** 与基线相比的改动："
              echo
              echo "https://github.com/${up_repo}/compare/${base_sha}...${head_sha}"
              echo
              echo '重点看 UPSTREAM.md 里列的那 10 处依赖。'
            else
              echo '上游与基线一致。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.IMAGE_REF }}
          build-args: |
            CHAT2API_REF=${{ env.CHAT2API_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image size and upstream version
        run: |
          docker image inspect ${{ env.IMAGE_REF }} --format 'image size: {{.Size}} bytes'
          echo '--- UPSTREAM_INFO (what this image was actually built from) ---'
          docker run --rm --entrypoint cat ${{ env.IMAGE_REF }} /app/UPSTREAM_INFO | tee /tmp/upstream_info.txt
          {
            echo
            echo '### Built from'
            echo
            echo '```'
            cat /tmp/upstream_info.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 不碰 docker 的本地套件：鉴权自检（自建 harness，真实 HTTP）与文档一致
      # 性检查。它们只需要 node >= 18，先跑，失败时不用等到 compose 起容器。
      - name: Auth selftest and documentation claims
        run: |
          set +e
          node tests/auth_selftest.js > /tmp/auth.log 2>&1
          auth_ec=$?
          node tests/docs_claims.js > /tmp/docs.log 2>&1
          docs_ec=$?
          cat /tmp/auth.log /tmp/docs.log
          {
            echo '### auth selftest / docs claims'
            echo
            echo "- auth_selftest exit: $auth_ec"
            echo "- docs_claims exit: $docs_ec"
            echo
            echo '```'
            tail -120 /tmp/auth.log
            tail -40 /tmp/docs.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$auth_ec" != 0 ] || [ "$docs_ec" != 0 ]; then
            # 断言名只出现在 stdout 里，而 job log 匿名读不到；转成注解才看得见。
            grep -h -E 'FAIL|FAILED|crashed' /tmp/auth.log /tmp/docs.log 2>/dev/null \
              | head -25 | while IFS= read -r r; do
                  echo "::error title=assertion::${r//'%'/'%25'}"
                done || true
            exit 1
          fi
      - name: Validate compose file
        run: docker compose config --quiet && echo 'compose config OK'

      # 这一步是「用真实 compose 起一遍」，所以它的日志就是我们唯一能看到的现场。
      # 之前它只打 60 行容器日志、失败时不写注解，于是失败信息在 job log 里
      # （匿名 403，读不到）和 job summary 里（只有 exit code）都看不见。
      # 现在：把 ps / 完整容器日志 / 健康检查结果全部打进 step summary，
      # 并把最后几行转成 ::error 注解，这样失败原因在 check-run 上就能读到。
      - name: Bring the stack up via compose
        run: |
          mkdir -p data
          # docker-compose.yml 是给群晖写的：它把 personal 声明成 external 网络
          # （群晖上那是既有的共享网络，反向代理和其他容器都挂在上面）。
          # runner 上没有这个网络，compose 会直接 'network personal declared as
          # external, but could not be found' —— 之前 CI 一直是死在这一句，而
          # 它发生在容器创建之前，所以容器日志是空的、看起来像"容器起不来"。
          # 这里在 runner 上就地建一个同名的桥接网络，测的还是仓库里那份 yml，
          # 不另写一份"CI 专用 compose"（那样测的就不是要交付的东西了）。
          docker network inspect personal >/dev/null 2>&1 \
            || docker network create personal >/dev/null
          # 诊断原则：每一条线索要么进 job summary，要么变成注解。job log 读不到（匿名 403），
          # 所以只在 echo 里出现的信息等于没记。
          set +e
          # 先把镜像里该有的东西验一遍：不用起服务，就能区分"镜像是坏的"和"服务起不来"。
          echo '--- image probe (no service started) ---'
          timeout 60 docker run --rm --entrypoint sh ${{ env.IMAGE_REF }} -c '
            set -x; id; ls -l /app/shim/entrypoint.sh; head -1 /app/shim/entrypoint.sh;
            node -v; ls -d /app/upstream/main /app/webui /app/shim;
            su-exec --help 2>&1 | head -2; command -v curl tini' > /tmp/probe.log 2>&1
          probe_ec=$?
          # 再真的起一次，stdout 与容器日志分开存（上一次两者混在一个文件里，结果两条都是空的）。
          timeout 90 docker compose up -d > /tmp/up.log 2>&1
          up_ec=$?
          ok=no
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8082/health >/dev/null 2>&1; then ok=yes; break; fi
            sleep 2
          done
          docker compose logs --no-color --timestamps > /tmp/app.log 2>&1
          docker compose ps -a > /tmp/ps.log 2>&1
          docker inspect chat2api > /tmp/inspect.log 2>&1
          {
            echo '### compose up'
            echo
            echo "- image probe exit: $probe_ec"
            echo "- compose up exit: $up_ec"
            echo "- /health reachable within 120s: $ok"
            echo "- container still running: $(docker inspect -f '{{.State.Running}}' chat2api 2>/dev/null || echo 'no container')"
            echo
            echo '<details><summary>image probe</summary>'
            echo
            echo '```'
            cat /tmp/probe.log 2>/dev/null || true
            echo '```'
            echo '</details>'
            echo
            echo '<details><summary>compose up output</summary>'
            echo
            echo '```'
            cat /tmp/up.log 2>/dev/null || true
            echo '```'
            echo '</details>'
            echo
            echo '<details><summary>container log</summary>'
            echo
            echo '```'
            cat /tmp/app.log 2>/dev/null || true
            echo '```'
            echo '</details>'
            echo
            echo '<details><summary>compose ps</summary>'
            echo
            echo '```'
            cat /tmp/ps.log 2>/dev/null || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          # 起不来时，把 4 条通道的内容都摘成注解（各取最后 10 行）。
          # 注解属于 check-run，匿名可读——这是唯一能绕过"job log 需要登录"的路。
          if [ "$ok" != yes ]; then
            emit() {
              echo "::error title=$1::$(tail -10 "$2" 2>/dev/null | tr '\n' '|' | tr -cd '[:print:] |' | cut -c1-800)"
            }
            emit probe /tmp/probe.log
            emit up /tmp/up.log
            emit container /tmp/app.log
            emit state /tmp/ps.log
            echo "::error title=compose::容器 120 秒内没有提供 /health（exit=$up_ec probe=$probe_ec）"
            exit 1
          fi
          if [ "$up_ec" != 0 ]; then
            echo "::error title=compose::docker compose up 返回 $up_ec"
            exit 1
          fi

      - name: Tear down compose stack
        if: always()
        run: docker compose down -v || true

      # 完整套件：自建临时容器，覆盖容器内部状态（端口、降权、时区、加密、重启）。
      - name: Run container smoke tests
        id: smoke
        timeout-minutes: 5
        run: |
          set +e
          # 整套 smoke 最多 4 分钟：卡住时必须失败，不能把 job 挂到 6 小时上限。
          # 外面套一层 timeout，是为了让"卡住"变成"有出口的失败"，而不是无限等待。
          export C2A_SMOKE_PROGRESS="$RUNNER_TEMP/smoke.progress"
          : > "$C2A_SMOKE_PROGRESS"
          # 4 分钟是墙钟上限，不是预算：一次正常的 smoke 只要 1~2 分钟。
          # -k 5：SIGTERM 之后 5 秒还不走就 SIGKILL，否则 docker 客户端卡在
          # 不可中断等待里时，timeout 自己也结束不了（#182/#183 都是这样）。
          timeout -k 5 240 bash tests/smoke.sh > /tmp/smoke.log 2>&1
          smoke_ec=$?
          if [ "$smoke_ec" = 124 ]; then
            echo '::error title=smoke::tests/smoke.sh 超过 20 分钟没有结束（timeout 124）——最后进度见下'
          fi
          cat /tmp/smoke.log
          {
            echo '### container smoke tests'
            echo
            echo "- exit: $smoke_ec"
            echo
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' /tmp/smoke.log | tail -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$smoke_ec" != 0 ]; then
            # 失败行转注解：job log 读不到，注解是唯一能看到的现场。
            # 先把"进行到哪一段"也抛出来，否则只看得到第一条 FAIL，不知道走到哪里。
            echo "::error title=smoke-progress::$(grep -a -E '^(== |  PASS|  FAIL)' /tmp/smoke.log | tail -6 | tr '\n' '|' | tr -cd '[:print:] |' | cut -c1-600)"
            grep -n -i -E '(^| )FAIL' /tmp/smoke.log 2>/dev/null \
              | tail -12 | while IFS= read -r r; do
                  echo "::error title=smoke::${r//'%'/'%25'}"
                done || true
            echo "::error title=smoke::tests/smoke.sh 退出 $smoke_ec"
            exit 1
          fi

      # 这一步总是执行（哪怕上面被 timeout 杀掉）：把 smoke 留下的进度文件回显出来。
      # stdout 会随进程被杀一起丢掉，这个文件不会——它就是墓碑。
      # 这一步总是执行（哪怕上面被 timeout 杀掉）：把 smoke 留下的进度文件回显出来。
      # stdout 会随进程被杀一起丢掉，这个文件不会——它就是墓碑。
      # 这一步总是执行（哪怕上面被 timeout 杀掉）：把 smoke 留下的进度文件回显出来。
      # stdout 会随进程被杀一起丢掉，这个文件不会——它就是墓碑。
      #
      # 心跳要单独摘掉：它每 30 秒一条，会把真正有用的 trace 挤出 tail 窗口
      # （#184 的 8 条 trace 注解全是 HEARTBEAT，等于什么都没说）。
      - name: Show smoke progress
        if: always()
        run: |
          PF="$RUNNER_TEMP/smoke.progress"
          if [ ! -s "$PF" ]; then
            echo 'smoke 没有写过进度文件（可能根本没启动）'
            echo '::error title=smoke-last-phase::no progress file at all'
            exit 0
          fi
          BEATS=$(grep -c HEARTBEAT "$PF" 2>/dev/null || echo 0)
          echo "### smoke progress（心跳 $BEATS 次）"
          echo
          echo '```'
          grep -v HEARTBEAT "$PF" | grep -v '^[0-9:]* FAIL ' | tail -30 || true
          echo '```'
          STEPS=$(grep -v HEARTBEAT "$PF" | tail -1 | tr -cd '[:alnum:] .:_-' | cut -c1-300)
          echo "::error title=smoke-stopped-at::${STEPS}"
          echo "::error title=smoke-heartbeats::${BEATS}"
          # 失败的断言本身：原样输出，不经过 tr —— 中文断言说明必须可读。
          # 只转义 % 和回车，否则 GitHub 的 :: 协议会把这行截断。
          grep '^[0-9:]* FAIL ' "$PF" | head -15 | while IFS= read -r line; do
            msg=${line//'%'/'%25'}
            msg=${msg//$'\r'/}
            printf '::error title=smoke-fail::%s\n' "$msg"
          done
          # 再补最后 6 条非 FAIL 的 trace，用来看它死在哪个阶段。
          grep -v HEARTBEAT "$PF" | grep -v '^[0-9:]* FAIL ' | tail -6 | while IFS= read -r line; do
            printf '::error title=smoke-trace::%s\n' "$(printf '%s' "$line" | tr ' ' '_' | tr -cd '[:alnum:] .:_-')"
          done
      # 再用「外部客户端」视角验证：只有 HTTP，不碰 docker。
      # 诊断规则和 smoke 步骤一样：job log 读不到（匿名 403），所以每条失败都必须
      # 变成注解，否则又是「exit code 1」这一句。
      - name: Verify over HTTP like a real client
        run: |
          set +e
          docker rm -f c2a-http >/dev/null 2>&1 || true
          # 门 pin 开：套件里四十多条 401/403/415 断言测的是凭据模型本身。
          # 「发布默认不登录」由主 smoke 末尾的局域网阶段单独验证。
          docker run -d --name c2a-http -p 127.0.0.1:18083:8082 \
            -e CHAT2API_REQUIRE_AUTH=1 \
            --log-opt max-size=10m --log-opt max-file=3 \
            ${{ env.IMAGE_REF }} >/dev/null 2>&1
          ok=no
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18083/health >/dev/null 2>&1; then ok=yes; break; fi
            sleep 2
          done
          if [ "$ok" != yes ]; then
            echo '::error title=verify::c2a-http 180 秒内没有提供 /health'
            docker inspect -f '{{.State.Status}} exit={{.State.ExitCode}}' c2a-http 2>&1 \
              | while IFS= read -r l; do echo "::error title=verify-state::${l}"; done
            docker logs --tail 20 c2a-http 2>&1 \
              | while IFS= read -r l; do echo "::error title=verify-log::${l//'%'/'%25'}"; done
            exit 1
          fi
          # CONTAINER 让套件能从**这个**容器里读管理密钥；不给的话它会去读
          # 一个不存在的 chat2api-smoke，四十多条带凭据的断言就全部退化成 401。
          VERIFY_URL=http://127.0.0.1:18083 CONTAINER=c2a-http \
            bash tests/smoke.sh > /tmp/verify.log 2>&1
          verify_ec=$?
          cat /tmp/verify.log
          {
            echo '### verify over HTTP'
            echo
            echo "- exit: $verify_ec"
            echo
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' /tmp/verify.log | tail -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          docker rm -f c2a-http >/dev/null 2>&1 || true
          if [ "$verify_ec" != 0 ]; then
            grep -n -E 'FAIL|❌' /tmp/verify.log 2>/dev/null | tail -12 \
              | while IFS= read -r r; do echo "::error title=verify-fail::${r//'%'/'%25'}"; done || true
            exit 1
          fi

      - name: Publish smoke output on failure
        if: failure()
        run: |
          {
            echo '### Failure context'
            echo
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' /tmp/smoke.log 2>/dev/null | tail -120 || echo 'no smoke log'
            echo '```'
            echo
            echo '### Container logs'
            echo
            echo '```'
            docker ps -a
            for c in $(docker ps -aq); do
              echo "--- $c ---"
              docker logs --tail 120 "$c" 2>&1 || true
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        if: success() && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 推送的正是上面测过的镜像，不再重建，所以一次运行 = 一个 digest。
      # 注意：推送走官方 ghcr.io（镜像站只代理下载，不接受上传）；
      # 部署侧从 ghcr.nju.edu.cn 拉取。
      - name: Push the tested image
        if: success() && github.event_name != 'pull_request'
        run: |
          OFFICIAL="ghcr.io/${{ github.repository }}:latest"
          docker tag ${{ env.IMAGE_REF }} "$OFFICIAL"
          docker push "$OFFICIAL"
          docker image inspect "$OFFICIAL" --format '{{index .RepoDigests 0}}'

      - name: Summary
        if: success()
        run: |
          {
            echo '### chat2api'
            echo
            echo "- image (pull): \`${{ env.IMAGE_REF }}\`"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo '- pushed: no (pull request)'
            else
              echo "- pushed: \`ghcr.io/${{ github.repository }}:latest\`"
            fi
            echo "- size: $(docker image inspect ${{ env.IMAGE_REF }} --format '{{.Size}}' | awk '{printf \"%.0f MB\", $1/1048576}')"
            echo
            echo 'Deploy on the NAS with: `./deploy.sh pull`, reset the container in Synology, then `./deploy.sh wait`'
          } >> "$GITHUB_STEP_SUMMARY"
