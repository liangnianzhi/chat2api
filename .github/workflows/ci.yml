name: build

# Container testing happens here rather than on a NAS or dev box.
#
# The weekly run rebuilds from upstream main on purpose: this deployment depends
# on upstream internals that can move (store.ts's Electron imports, the vite
# config's rollupOptions.input shape, the bootstrap in ipc/handlers.ts, the
# preload output format). A scheduled build turns silent drift into a failing
# run instead of a surprise.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  packages: write

env:
  IMAGE_REF: ghcr.io/${{ github.repository }}:latest
  CHAT2API_REF: main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check
        run: |
          bash -n tests/smoke.sh
          sh -n shim/entrypoint.sh
          echo 'shell syntax OK'

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=error tests/smoke.sh shim/entrypoint.sh

      - name: Node syntax check
        run: |
          node --check webui/server.js
          node --check webui/preload-bridge.js
          node --check shim/electron-shim.js
          node --check shim/gateway.js
          echo 'node syntax OK'

  build-test-publish:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.IMAGE_REF }}
          build-args: |
            CHAT2API_REF=${{ env.CHAT2API_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image size and upstream version
        run: |
          docker image inspect ${{ env.IMAGE_REF }} --format 'image size: {{.Size}} bytes'
          docker run --rm --entrypoint cat ${{ env.IMAGE_REF }} /app/UPSTREAM_INFO

      - name: Validate compose file
        run: docker compose config --quiet && echo 'compose config OK'

      # Exercise the documented deployment path exactly as documented: only
      # mkdir + compose up. No .env, no manual chown.
      - name: Bring the stack up via compose
        run: |
          mkdir -p data
          docker compose up -d

          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8082/health >/dev/null 2>&1; then break; fi
            sleep 2
          done

          echo '--- /health ---'
          curl -fsS http://127.0.0.1:8082/health
          echo
          echo '--- one port, three surfaces ---'
          curl -fsS -o /dev/null -w 'GET /                -> HTTP %{http_code}\n' http://127.0.0.1:8082/
          curl -fsS -o /dev/null -w 'GET /v1/models      -> HTTP %{http_code}\n' http://127.0.0.1:8082/v1/models
          curl -sS  -o /dev/null -w 'GET /management/...  -> HTTP %{http_code}\n' http://127.0.0.1:8082/management/accounts

          echo '--- published ports ---'
          docker port chat2api

      - name: Tear down compose stack
        if: always()
        run: |
          docker compose logs --tail 80 || true
          docker compose down -v || true

      - name: Run container smoke tests
        run: |
          IMAGE=${{ env.IMAGE_REF }} bash tests/smoke.sh

      - name: Container logs on failure
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -aq); do
            echo "--- logs: $c ---"
            docker logs --tail 100 "$c" 2>&1 || true
          done

      - name: Log in to GHCR
        if: success() && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        if: success() && github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest

      - name: Push image
        if: success() && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CHAT2API_REF=${{ env.CHAT2API_REF }}
          cache-from: type=gha
