name: build

# Container testing happens here rather than on a NAS or dev box.
#
# The weekly run rebuilds from upstream main on purpose: this deployment depends
# on three upstream surfaces (store.ts's Electron imports, the vite config's
# rollupOptions.input shape, and the bootstrap staying in ipc/handlers.ts). A
# scheduled build turns silent drift into a failing run instead of a surprise.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  packages: write

env:
  # Must match docker-compose.yml's image reference. The build tags the image
  # with this same reference so the compose step uses the freshly built image
  # instead of pulling whatever is already published.
  IMAGE_REF: ghcr.io/${{ github.repository }}:latest
  CHAT2API_REF: main

jobs:
  # ---------------------------------------------------------------------------
  # Fast fail: shell syntax and lint before spending time on a docker build.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check
        run: |
          bash -n tests/smoke.sh
          sh -n shim/entrypoint.sh
          echo 'shell syntax OK'

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # Only fail on errors, not style nits.
          shellcheck --severity=error tests/smoke.sh shim/entrypoint.sh

  # ---------------------------------------------------------------------------
  # Build, deploy, test - and publish to GHCR on main/tags.
  # ---------------------------------------------------------------------------
  build-test-publish:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.IMAGE_REF }}
          build-args: |
            CHAT2API_REF=${{ env.CHAT2API_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image size and upstream version
        run: |
          docker image inspect ${{ env.IMAGE_REF }} --format 'image size: {{.Size}} bytes'
          docker run --rm --entrypoint cat ${{ env.IMAGE_REF }} /app/UPSTREAM_INFO

      - name: Validate compose file
        run: docker compose config --quiet && echo 'compose config OK'

      # Exercise the documented deployment path exactly as documented: only
      # mkdir + compose up. No .env, no manual chown - if that stops working,
      # the docs are wrong.
      - name: Bring the stack up via compose
        run: |
          mkdir -p data
          docker compose up -d

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then break; fi
            sleep 2
          done

          echo '--- /health ---'
          curl -fsS http://127.0.0.1:8080/health
          echo
          echo '--- web console (no login) ---'
          curl -fsS -o /dev/null -w 'HTTP %{http_code}\n' http://127.0.0.1:8081/
          echo '--- console proxy reaches the management API ---'
          curl -sS -o /dev/null -w 'HTTP %{http_code}\n' http://127.0.0.1:8081/v0/management/providers

          echo '--- image used by the container ---'
          docker inspect chat2api --format '{{.Config.Image}} / {{.Image}}'

      - name: Tear down compose stack
        if: always()
        run: |
          docker compose logs --tail 40 || true
          docker compose down -v || true

      # The deep functional suite: console, account CRUD, credential encryption,
      # persistence across restarts, proxy whitelist, image size budget.
      - name: Run container smoke tests
        run: |
          IMAGE=${{ env.IMAGE_REF }} bash tests/smoke.sh

      - name: Container logs on failure
        if: failure()
        run: |
          echo '--- all containers ---'
          docker ps -a
          for c in $(docker ps -aq); do
            echo "--- logs: $c ---"
            docker logs --tail 80 "$c" 2>&1 || true
          done

      # ---------------------------------------------------------------------
      # Publish (main and version tags only; never on pull requests)
      # ---------------------------------------------------------------------
      - name: Log in to GHCR
        if: success() && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        if: success() && github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # 只维护单一的滚动 latest 标签。
          tags: |
            type=raw,value=latest

      - name: Push image
        if: success() && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CHAT2API_REF=${{ env.CHAT2API_REF }}
          cache-from: type=gha
