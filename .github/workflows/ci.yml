name: build

# push 到 main 时自动构建、测试并推送 latest。
# PR 也会构建并测试（不推送）；workflow_dispatch 可手动重建。
#
# 脚本一律用解释器显式调用（sh/bash/node ...），不依赖工作区里的可执行位：
# git 里记的 mode 和磁盘上的 mode 可以不一致（本仓库就踩过：测试脚本在
# git 里是 100644，Windows 工作区里是 755，于是本地全绿、CI 上 exit 126）。
# 这也是 lint 自己的"入口必须可执行"检查保留的意义：它查的是 git mode。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_REF: ghcr.nju.edu.cn/${{ github.repository }}:latest
  CHAT2API_REF: ${{ github.ref_name }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 报一下解释器版本，失败时好判断是谁的问题：
      #   * lint 自己必须能在 dash 下跑（下方用 sh 调它，跟"被随便谁调用"等价）；
      #   * tests/smoke.sh 是 bash 脚本，lint 按 shebang 分流才用 bash -n 判它。
      - name: Shells
        run: |
          sh --version 2>&1 | head -1 || true
          readlink -f /bin/sh || true
          bash --version | head -1

      # lint 需要 node（"Node syntax" 与 docs_claims.js 两段）。没有 node 时
      # lint 会明确报 FAIL，不会再静默跳段。版本跟镜像一致（node:20-alpine）。
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # tests/lint.sh covers what used to be two hand-written steps, and more:
      #   - LF-only line endings for every text file (catches a CRLF checkout,
      #     which silently breaks the shebang of entrypoint.sh inside the image)
      #   - no UTF-8 BOM on scripts
      #   - shell syntax on every *.sh, judged by the interpreter its shebang
      #     declares; node --check on every *.js (no hand-kept list, so a new
      #     shim/*.js can never be silently left unchecked)
      #   - the executable bit on the entrypoints
      #
      # 用 sh 调 lint，而不是 bash：lint 的契约是"任何 POSIX sh 都能跑"，
      # 而 CI 若用 bash 调它，bash 专有语法就永远暴露不了——上一轮红了一整天
      # 正是这么来的（脚本里写了 <<<，bash 能解析，dash 连解析都不做）。
      # 结果写进 job summary：拿不到 job log 时也能看到是哪一条在报错。
      - name: Repo lint
        run: |
          OUT="$RUNNER_TEMP/lint.out"
          # 这里的 bash 只负责管上面那个管道；lint 自己必须由 sh(dash) 跑。
          set -o pipefail
          sh tests/lint.sh 2>&1 | tee "$OUT"
          ec=$?
          {
            echo '### Repo lint'
            echo
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$ec"

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # lint.sh 现在声明 /bin/sh，也纳入检查；auth_probe.sh 是给容器里跑的探针。
          shellcheck --severity=error \
            tests/lint.sh tests/smoke.sh deploy.sh shim/entrypoint.sh tests/auth_probe.sh

  build-test-publish:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      # 上游版本对比：把「本次实际用到的上游版本」与 UPSTREAM.lock 记录的基线
      # 对比，写进 job summary。上游更新不等于一定出错，但需要人知道。
      #
      # 这一段不参与构建成败：它查询的是别人的仓库，限流、超时、网络抖动都会发生，
      # 而这些都不是本仓库的问题。查询失败只写一行提示，构建继续。
      - name: Compare upstream version against the baseline
        id: upstream
        continue-on-error: true
        run: |
          up_repo="$(sed -n 's/^repo=//p' UPSTREAM.lock)"
          base_ver="$(sed -n 's/^version=//p' UPSTREAM.lock)"
          base_sha="$(sed -n 's/^commit=//p' UPSTREAM.lock)"

          head_sha="$(curl -fsS "https://api.github.com/repos/${up_repo}/commits/main" \
            -H 'Accept: application/vnd.github+json' | grep -oE '"sha": *"[0-9a-f]{40}"' | head -1 | grep -oE '[0-9a-f]{40}')" || true
          head_ver="$(curl -fsS "https://raw.githubusercontent.com/${up_repo}/main/package.json" \
            | grep -oE '"version": *"[^"]+"' | head -1 | sed 's/.*"version": *"//;s/"//')" || true
          head_sha="${head_sha:-unknown}"
          head_ver="${head_ver:-unknown}"

          echo "baseline: ${base_ver} (${base_sha})"
          echo "upstream: ${head_ver} (${head_sha})"

          {
            echo '### Upstream version'
            echo
            echo "| | version | commit |"
            echo "|---|---|---|"
            echo "| baseline (UPSTREAM.lock) | \`${base_ver}\` | \`${base_sha}\` |"
            echo "| upstream main now | \`${head_ver}\` | \`${head_sha}\` |"
            echo
            if [ "$head_sha" = "unknown" ]; then
              echo '上游版本查询失败（限流或网络问题），本次跳过对比；构建不受影响。'
            elif [ "$head_sha" != "$base_sha" ]; then
              echo "**上游有更新。** 与基线相比的改动："
              echo
              echo "https://github.com/${up_repo}/compare/${base_sha}...${head_sha}"
              echo
              echo '重点看 UPSTREAM.md 里列的那 10 处依赖。'
            else
              echo '上游与基线一致。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.IMAGE_REF }}
          build-args: |
            CHAT2API_REF=${{ env.CHAT2API_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image size and upstream version
        run: |
          docker image inspect ${{ env.IMAGE_REF }} --format 'image size: {{.Size}} bytes'
          echo '--- UPSTREAM_INFO (what this image was actually built from) ---'
          docker run --rm --entrypoint cat ${{ env.IMAGE_REF }} /app/UPSTREAM_INFO | tee /tmp/upstream_info.txt
          {
            echo
            echo '### Built from'
            echo
            echo '```'
            cat /tmp/upstream_info.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 不碰 docker 的本地套件：鉴权自检（自建 harness，真实 HTTP）与文档一致
      # 性检查。它们只需要 node >= 18，先跑，失败时不用等到 compose 起容器。
      - name: Auth selftest and documentation claims
        run: |
          node tests/auth_selftest.js
          node tests/docs_claims.js

      - name: Validate compose file
        run: docker compose config --quiet && echo 'compose config OK'

      - name: Bring the stack up via compose
        run: |
          mkdir -p data
          docker compose up -d
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8082/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo '--- container log ---'
          docker compose logs --tail 60 || true

      - name: Tear down compose stack
        if: always()
        run: docker compose down -v || true

      # 完整套件：自建临时容器，覆盖容器内部状态（端口、降权、时区、加密、重启）。
      - name: Run container smoke tests
        id: smoke
        run: |
          set -o pipefail
          IMAGE=${{ env.IMAGE_REF }} bash tests/smoke.sh 2>&1 | tee /tmp/smoke.log

      # 再用「外部客户端」视角验证：只有 HTTP，不碰 docker。
      - name: Verify over HTTP like a real client
        run: |
          docker run -d --name c2a-http -p 127.0.0.1:18083:8082 ${{ env.IMAGE_REF }} >/dev/null
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18083/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          VERIFY_URL=http://127.0.0.1:18083 bash tests/smoke.sh
          docker rm -f c2a-http >/dev/null 2>&1 || true

      - name: Publish smoke output on failure
        if: failure()
        run: |
          {
            echo '### Failure context'
            echo
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' /tmp/smoke.log 2>/dev/null | tail -120 || echo 'no smoke log'
            echo '```'
            echo
            echo '### Container logs'
            echo
            echo '```'
            docker ps -a
            for c in $(docker ps -aq); do
              echo "--- $c ---"
              docker logs --tail 120 "$c" 2>&1 || true
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        if: success() && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 推送的正是上面测过的镜像，不再重建，所以一次运行 = 一个 digest。
      # 注意：推送走官方 ghcr.io（镜像站只代理下载，不接受上传）；
      # 部署侧从 ghcr.nju.edu.cn 拉取。
      - name: Push the tested image
        if: success() && github.event_name != 'pull_request'
        run: |
          OFFICIAL="ghcr.io/${{ github.repository }}:latest"
          docker tag ${{ env.IMAGE_REF }} "$OFFICIAL"
          docker push "$OFFICIAL"
          docker image inspect "$OFFICIAL" --format '{{index .RepoDigests 0}}'

      - name: Summary
        if: success()
        run: |
          {
            echo '### chat2api'
            echo
            echo "- image (pull): \`${{ env.IMAGE_REF }}\`"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo '- pushed: no (pull request)'
            else
              echo "- pushed: \`ghcr.io/${{ github.repository }}:latest\`"
            fi
            echo "- size: $(docker image inspect ${{ env.IMAGE_REF }} --format '{{.Size}}' | awk '{printf \"%.0f MB\", $1/1048576}')"
            echo
            echo 'Deploy on the NAS with: `./deploy.sh pull`, reset the container in Synology, then `./deploy.sh wait`'
          } >> "$GITHUB_STEP_SUMMARY"
