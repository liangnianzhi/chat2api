name: build

# Container testing happens here rather than on the NAS.
#
# The weekly run rebuilds from upstream main on purpose: this deployment depends
# on three upstream surfaces (store.ts's Electron imports, the vite config's
# rollupOptions.input shape, and the bootstrap staying in ipc/handlers.ts). A
# scheduled build turns silent drift into a failing run instead of a surprise.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: chat2api-gateway
  CHAT2API_REF: main

jobs:
  # ---------------------------------------------------------------------------
  # Fast fail: shell syntax and lint before spending time on a docker build.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check
        run: |
          sh -n manage.sh
          bash -n tests/smoke.sh
          echo 'shell syntax OK'

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # Only fail on errors, not style nits.
          shellcheck --severity=error manage.sh tests/smoke.sh

  # ---------------------------------------------------------------------------
  # Build, deploy, test - and publish on main/tags.
  # ---------------------------------------------------------------------------
  build-test-publish:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:latest
          build-args: |
            CHAT2API_REF=${{ env.CHAT2API_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image size and upstream version
        run: |
          docker image inspect ${{ env.IMAGE_NAME }}:latest --format 'image size: {{.Size}} bytes'
          docker run --rm --entrypoint cat ${{ env.IMAGE_NAME }}:latest /app/UPSTREAM_INFO

      - name: Validate compose file
        run: docker compose config --quiet && echo 'compose config OK'

      # Exercise the documented deployment path: docker compose, not just docker
      # run. This is what operators actually follow.
      - name: Bring the stack up via compose
        env:
          CHAT2API_MANAGEMENT_SECRET: ci-compose-secret
        run: |
          mkdir -p data && sudo chown -R 1000:1000 data
          docker compose up -d

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then break; fi
            sleep 2
          done

          echo '--- /health ---'
          curl -fsS http://127.0.0.1:8080/health
          echo
          echo '--- web console ---'
          curl -fsS -o /dev/null -w 'HTTP %{http_code}\n' http://127.0.0.1:8081/

      - name: Tear down compose stack
        if: always()
        run: |
          docker compose logs --tail 40 || true
          docker compose down -v || true

      # The deep functional suite: auth, account CRUD, credential encryption,
      # persistence across restarts, console proxy whitelist, image size budget.
      - name: Run container smoke tests
        run: |
          IMAGE=${{ env.IMAGE_NAME }}:latest bash tests/smoke.sh

      - name: Container logs on failure
        if: failure()
        run: |
          echo '--- all containers ---'
          docker ps -a
          for c in $(docker ps -aq); do
            echo "--- logs: $c ---"
            docker logs --tail 80 "$c" 2>&1 || true
          done

      # ---------------------------------------------------------------------
      # Publish (main and version tags only; never on pull requests)
      # ---------------------------------------------------------------------
      - name: Log in to GHCR
        if: success() && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        if: success() && github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push image
        if: success() && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CHAT2API_REF=${{ env.CHAT2API_REF }}
          cache-from: type=gha
