name: build

# push 到 main 时自动构建、测试并推送 latest。
# PR 也会构建并测试（不推送）；workflow_dispatch 可手动重建。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_REF: ghcr.io/${{ github.repository }}:latest
  CHAT2API_REF: main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check
        run: |
          bash -n tests/smoke.sh
          sh -n deploy.sh
          sh -n shim/entrypoint.sh
          echo 'shell syntax OK'

      - name: Node syntax check
        run: |
          node --check webui/server.js
          node --check webui/preload-bridge.js
          node --check shim/electron-shim.js
          node --check shim/gateway.js
          echo 'node syntax OK'

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=error tests/smoke.sh deploy.sh shim/entrypoint.sh

  build-test-publish:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.IMAGE_REF }}
          build-args: |
            CHAT2API_REF=${{ env.CHAT2API_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image size and upstream version
        run: |
          docker image inspect ${{ env.IMAGE_REF }} --format 'image size: {{.Size}} bytes'
          docker run --rm --entrypoint cat ${{ env.IMAGE_REF }} /app/UPSTREAM_INFO

      - name: Validate compose file
        run: docker compose config --quiet && echo 'compose config OK'

      - name: Bring the stack up via compose
        run: |
          mkdir -p data
          docker compose up -d
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8082/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo '--- container log ---'
          docker compose logs --tail 60 || true

      - name: Tear down compose stack
        if: always()
        run: docker compose down -v || true

      # 完整套件：自建临时容器，覆盖容器内部状态（端口、降权、时区、加密、重启）。
      - name: Run container smoke tests
        id: smoke
        run: |
          set -o pipefail
          IMAGE=${{ env.IMAGE_REF }} bash tests/smoke.sh 2>&1 | tee /tmp/smoke.log

      # 再用「外部客户端」视角验证一遍同一个镜像：只有 HTTP，不碰 docker。
      # 这能抓到仅在真实部署路径下出现的问题（例如代理自报 stopped）。
      - name: Verify over HTTP like a real client
        if: success()
        run: |
          docker run -d --name c2a-http -p 127.0.0.1:18083:8082 ${{ env.IMAGE_REF }} >/dev/null
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18083/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          VERIFY_URL=http://127.0.0.1:18083 bash tests/smoke.sh
          docker rm -f c2a-http >/dev/null 2>&1 || true

      - name: Publish smoke output on failure
        if: failure()
        run: |
          if [ ! -f /tmp/smoke.log ]; then echo 'no smoke log'; exit 0; fi
          {
            echo '### Smoke test output'
            echo
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' /tmp/smoke.log | tail -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Container logs on failure
        if: failure()
        run: |
          {
            echo '### Container logs'
            echo
            echo '```'
            docker ps -a
            for c in $(docker ps -aq); do
              echo "--- $c ---"
              docker logs --tail 120 "$c" 2>&1 || true
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        if: success() && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 推送的正是上面测过的镜像，不再重建，所以一次运行 = 一个 digest。
      - name: Push the tested image
        if: success() && github.event_name != 'pull_request'
        run: |
          docker push ${{ env.IMAGE_REF }}
          docker image inspect ${{ env.IMAGE_REF }} --format '{{index .RepoDigests 0}}'

      - name: Summary
        if: success()
        run: |
          {
            echo '### chat2api'
            echo
            echo "- image: \`${{ env.IMAGE_REF }}\`"
            echo "- upstream: $(docker run --rm --entrypoint cat ${{ env.IMAGE_REF }} /app/UPSTREAM_INFO | tr '\n' ' ')"
            echo "- size: $(docker image inspect ${{ env.IMAGE_REF }} --format '{{.Size}}' | awk '{printf \"%.0f MB\", $1/1048576}')"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo '- pushed: no (pull request)'
            else
              echo '- pushed: yes'
            fi
            echo
            echo 'Deploy on the NAS with: `./deploy.sh`'
          } >> "$GITHUB_STEP_SUMMARY"
