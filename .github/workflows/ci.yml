name: build

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: write   # 仅用于失败时提交 smoke-failure.log，绿后移除
  packages: write

env:
  IMAGE_REF: ghcr.io/${{ github.repository }}:latest
  CHAT2API_REF: main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax check
        run: |
          bash -n tests/smoke.sh
          sh -n shim/entrypoint.sh
          echo 'shell syntax OK'
      - name: Node syntax check
        run: |
          node --check webui/server.js
          node --check webui/preload-bridge.js
          node --check shim/electron-shim.js
          node --check shim/gateway.js
          echo 'node syntax OK'
      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=error tests/smoke.sh shim/entrypoint.sh

  build-test-publish:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.IMAGE_REF }}
          build-args: |
            CHAT2API_REF=${{ env.CHAT2API_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Show image size, upstream version and digest
        run: |
          docker image inspect ${{ env.IMAGE_REF }} --format 'image size: {{.Size}} bytes'
          docker run --rm --entrypoint cat ${{ env.IMAGE_REF }} /app/UPSTREAM_INFO
      - name: Validate compose file
        run: docker compose config --quiet && echo 'compose config OK'
      - name: Bring the stack up via compose
        run: |
          mkdir -p data
          docker compose up -d
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8082/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo '--- container log ---'
          docker compose logs --tail 60 || true
      - name: Tear down compose stack
        if: always()
        run: |
          docker compose down -v || true
      - name: Run container smoke tests
        id: smoke
        run: |
          set -o pipefail
          IMAGE=${{ env.IMAGE_REF }} bash tests/smoke.sh 2>&1 | tee /tmp/smoke.log
      - name: Container logs on failure
        if: failure()
        run: |
          { echo '# Smoke test output'; echo; echo '```'; cat /tmp/smoke.log 2>/dev/null || echo none; echo '```'; } > smoke-failure.log
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f smoke-failure.log
          git commit -m 'ci: capture failure output [skip ci]' || { echo 'nothing'; exit 0; }
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo 'push failed'
      - name: Log in to GHCR
        if: success() && github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image
        if: success() && github.event_name == 'workflow_dispatch'
        run: docker push ${{ env.IMAGE_REF }}
