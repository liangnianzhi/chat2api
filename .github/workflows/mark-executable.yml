name: mark-executable

# 一次性工作流：把入口脚本在 git 里的 mode 从 100644 改成 100755。
# 只能在 Actions 页面手动点 Run workflow 触发（没有 push/pull_request 触发器）。
#
# 为什么需要它：网页编辑器、拖拽上传、内容接口都会把文件记成 644，改不了
# mode；能改的只有 git 索引本身。而本仓库的 Windows 工作区 core.fileMode
# 为 false，磁盘上 chmod 也不会被 git 看见，所以这件事只能在一台 Linux 上做。
#
# 跑完就可以删掉这个文件了。

on:
  workflow_dispatch:

permissions:
  contents: write   # 推 mode 改动
  actions: write    # gh workflow run 派发 build

jobs:
  chmod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record 100755 for the entrypoints
        run: |
          set -eux
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git update-index --chmod=+x \
            deploy.sh shim/entrypoint.sh tests/smoke.sh tests/lint.sh tests/auth_probe.sh

          echo '--- 索引里的 mode（应为 100755）:'
          git ls-files -s -- deploy.sh shim/entrypoint.sh tests/smoke.sh tests/lint.sh tests/auth_probe.sh

          echo '--- 待提交的改动:'
          git diff --cached --summary

          # 第二次运行时 mode 已经对了：不提交、不推送，也不报错。
          if git diff --cached --quiet; then
            echo '没有改动可提交：mode 已经是 100755'
          else
            git commit -m 'chore: mark the entrypoints executable in git' \
                       -m 'deploy.sh, shim/entrypoint.sh and the three test scripts were recorded as 100644. A Linux checkout therefore hands out 644 files: the image exec-s the entrypoint as 126/127, and ./deploy.sh does not run on the NAS. Not one byte of any file changes here -- only the mode bits.'
            # trigger 是 workflow_dispatch 时 HEAD 指向 main；detached 也一并兜住。
            git push origin 'HEAD:main'
          fi

      # GITHUB_TOKEN 推的提交不会自动触发别的 workflow（防递归），
      # 但 workflow_dispatch 是官方明说的例外，所以这里直接把构建打起来，
      # 省掉"再点一次 build"。失败也不影响 mode 已经改好这件事。
      - name: Run the CI now
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 派发 ci.yml 的 workflow_dispatch run，并等它结束，这样 curl 一个链接
          # 就能看到结果。GITHUB_TOKEN 推的提交不会触发别的 workflow（防递归），
          # 但 workflow_dispatch 是官方明说的例外，所以这一步能真的把 CI 排上队。
          gh workflow run ci.yml --ref main
          sleep 8
          run_id=$(gh run list --workflow ci.yml --limit 1 --json databaseId -q '.[0].databaseId')
          echo "run_id=$run_id"
          gh run watch "$run_id" --exit-status || true
