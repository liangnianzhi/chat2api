# Chat2API 网关 —— 最小化 compose
#
# 镜像由 GitHub Actions 构建并推送到 GHCR，这里只负责运行。
#
# 首次使用：
#   cp .env.example .env
#   ./manage.sh keygen          # 生成管理密钥，填到 .env
#   ./manage.sh up              # 拉取镜像并启动
#
# 打开 http://<主机IP>:8081 即是 Web 管理台（首次需填写管理密钥）。
services:
  chat2api:
    # 不在本地构建；镜像来自 CI 推送的 GHCR。
    # 若想改用本地源码构建的镜像，执行 ./manage.sh build，
    # 它会把结果打成同一个标签，compose 会直接使用。
    image: ghcr.io/liangnianzhi/chat2api:latest
    container_name: chat2api
    restart: unless-stopped
    ports:
      - "${CHAT2API_BIND:-0.0.0.0}:${CHAT2API_PORT:-8080}:8080"   # OpenAI 兼容 API
      - "${CHAT2API_BIND:-0.0.0.0}:${CHAT2API_UI_PORT:-8081}:8081" # Web 管理台
    volumes:
      # 账号、配置、日志与凭证加密密钥都在这里。务必单独备份。
      # 需属主为 1000:1000（./manage.sh up 会自动修正）。
      - ./data:/data
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 管理台登录用的密钥。留空则管理台无法登录。
      CHAT2API_MANAGEMENT_SECRET: ${CHAT2API_MANAGEMENT_SECRET:-}

# ---------------------------------------------------------------------------
# 其余可配置项都在 Web 管理台里改（写入 data/）：
#   * 客户端 API 密钥        -> 管理台「客户端 API 密钥」页
#   * 负载均衡策略           -> 管理台「代理设置」
#   * 日志级别 / 超时 / 重试 -> 管理台「代理设置」
#   * 账号与提供商           -> 管理台「添加账号」
#
# 若确实想用环境变量覆盖（例如做声明式部署），以下变量仍被识别：
#   CHAT2API_API_KEY / CHAT2API_ENABLE_API_KEY
#   CHAT2API_LOG_LEVEL / CHAT2API_LB_STRATEGY
#   CHAT2API_REQUEST_TIMEOUT / CHAT2API_RETRY_COUNT
#   CHAT2API_ENABLE_CORS / CHAT2API_CORS_ORIGIN
#   CHAT2API_ENABLE_WEBUI=false    关闭管理台
# ---------------------------------------------------------------------------
