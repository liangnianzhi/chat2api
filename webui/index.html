<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat2API 管理台</title>
<style>
  :root {
    --bg:#0f1115; --card:#171a21; --line:#262b36; --fg:#e6e9ef;
    --muted:#8b93a7; --accent:#4c8dff; --ok:#3fb950; --err:#f85149; --warn:#d29922;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:14px 20px;
           background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  header h1 { margin:0; font-size:16px; font-weight:600; }
  .badge { font-size:12px; padding:2px 8px; border-radius:10px; background:#22304a; color:var(--accent); }
  .badge.ok { background:#12261a; color:var(--ok); }
  .badge.err { background:#2d1416; color:var(--err); }
  main { padding:20px; max-width:1080px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .card h2 { margin:0 0 12px; font-size:14px; font-weight:600; color:var(--muted);
             text-transform:uppercase; letter-spacing:.04em; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  input, select, textarea { width:100%; padding:8px 10px; background:#0c0e12; color:var(--fg);
    border:1px solid var(--line); border-radius:6px; font:inherit; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); }
  textarea { min-height:74px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; }
  button { padding:8px 14px; border:1px solid var(--line); background:#20242e; color:var(--fg);
    border-radius:6px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.danger { color:var(--err); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .row > * { flex:1 1 180px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  .empty { color:var(--muted); padding:18px 0; text-align:center; }
  .msg { padding:10px 12px; border-radius:6px; margin-top:12px; font-size:13px; display:none; }
  .msg.show { display:block; }
  .msg.ok { background:#12261a; color:var(--ok); border:1px solid #1f4d2c; }
  .msg.err { background:#2d1416; color:var(--err); border:1px solid #5c2226; }
  code { background:#0c0e12; padding:1px 5px; border-radius:4px; font-size:12px; }
  .hint { color:var(--muted); font-size:12px; margin-top:6px; line-height:1.6; }
  dialog { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:10px;
           padding:20px; width:min(560px,92vw); }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .dot.active { background:var(--ok); } .dot.other { background:var(--warn); }
</style>
</head>
<body>
<header>
  <h1>Chat2API 管理台</h1>
  <span id="statusBadge" class="badge">连接中…</span>
  <span style="flex:1"></span>
  <button id="btnRefresh">刷新</button>
</header>

<main>
  <div id="banner" class="msg"></div>

  <div class="card">
    <h2>概览</h2>
    <div id="overview" class="empty">—</div>
  </div>

  <div class="card">
    <h2>添加账号</h2>
    <div class="row">
      <div>
        <label for="acctProvider">提供商</label>
        <select id="acctProvider"></select>
      </div>
      <div>
        <label for="acctName">名称（自定义，便于识别）</label>
        <input id="acctName" placeholder="例如 main">
      </div>
      <div>
        <label for="acctEmail">邮箱（可选）</label>
        <input id="acctEmail" placeholder="可选">
      </div>
    </div>
    <label for="acctCreds">凭证（JSON）</label>
    <textarea id="acctCreds" placeholder='{"token":"在这里粘贴 token"}'></textarea>
    <div class="hint" id="credHint">字段名取决于所选提供商，切换后此处会给出建议字段。</div>
    <div style="margin-top:12px"><button class="primary" id="btnAddAccount">添加账号</button></div>
    <div id="acctMsg" class="msg"></div>
  </div>

  <div class="card">
    <h2>账号列表</h2>
    <div id="acctList" class="empty">—</div>
  </div>

  <div class="card">
    <h2>客户端 API 密钥</h2>
    <div class="row">
      <div style="flex:2 1 240px">
        <label for="keyName">名称</label>
        <input id="keyName" placeholder="例如 my-client">
      </div>
      <div style="flex:1 1 140px">
        <label>&nbsp;</label>
        <button class="primary" id="btnAddKey" style="width:100%">生成密钥</button>
      </div>
    </div>
    <div id="keyList" style="margin-top:12px"></div>
    <div id="keyMsg" class="msg"></div>
  </div>

  <div class="card">
    <h2>代理设置</h2>
    <div class="row">
      <div>
        <label for="cfgLb">负载均衡策略</label>
        <select id="cfgLb">
          <option value="round-robin">轮询 round-robin</option>
          <option value="fill-first">优先填满 fill-first</option>
          <option value="failover">故障转移 failover</option>
        </select>
      </div>
      <div>
        <label for="cfgLog">日志级别</label>
        <select id="cfgLog">
          <option value="debug">debug</option>
          <option value="info">info</option>
          <option value="warn">warn</option>
          <option value="error">error</option>
        </select>
      </div>
      <div>
        <label for="cfgTimeout">请求超时 (ms)</label>
        <input id="cfgTimeout" type="number" min="1000" step="1000">
      </div>
      <div>
        <label for="cfgRetry">重试次数</label>
        <input id="cfgRetry" type="number" min="0" max="10">
      </div>
    </div>
    <div style="margin-top:12px"><button class="primary" id="btnSaveCfg">保存设置</button></div>
    <div id="cfgMsg" class="msg"></div>
  </div>
</main>

<dialog id="dKey">
  <h2 style="margin-top:0">API 密钥已生成</h2>
  <p class="hint">请立即复制保存——关闭后无法再次查看完整密钥。</p>
  <input id="dKeyVal" readonly style="font-family:ui-monospace,monospace">
  <div style="margin-top:14px;text-align:right">
    <button id="dKeyCopy">复制</button>
    <button class="primary" id="dKeyClose">关闭</button>
  </div>
</dialog>

<script>
'use strict';
const $ = (id) => document.getElementById(id);

const CRED_HINTS = {
  deepseek:   { token: '从 chat.deepseek.com 的 DevTools → Application → Local Storage 取 userToken' },
  glm:        { refresh_token: 'GLM 的 refresh token' },
  kimi:       { token: 'Kimi 的 JWT token' },
  minimax:    { token: 'MiniMax JWT token', realUserID: 'MiniMax realUserID' },
  perplexity: { cookies: 'Perplexity 的 Cookie 字符串' },
  qwen:       { ticket: '通义千问 SSO ticket' },
  'qwen-ai':  { token: 'Qwen AI 的 JWT token' },
  mimo:       { cookies: 'MiMo 的 Cookie 字符串' },
  zai:        { token: 'Z.ai token（上游提示前端风控，可能不可用）' },
};

let state = { accounts:[], providers:[], keys:[], config:null };

// 管理密钥由服务端注入，浏览器侧不需要携带任何凭据。
async function api(method, path, body) {
  const headers = {};
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  const res = await fetch(path, { method, headers,
    body: body === undefined ? undefined : JSON.stringify(body) });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = { raw:text }; }
  if (!res.ok) {
    const m = (data && data.error && data.error.message) || ('HTTP ' + res.status);
    const e = new Error(m); e.status = res.status; throw e;
  }
  return data;
}
function showMsg(el, text, ok) {
  el.textContent = text;
  el.className = 'msg show ' + (ok ? 'ok' : 'err');
  if (ok) setTimeout(() => { el.className = 'msg'; }, 4000);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function setBadge(t, cls) {
  const b = $('statusBadge'); b.textContent = t; b.className = 'badge' + (cls ? ' ' + cls : '');
}
function banner(text, ok) {
  const el = $('banner');
  if (!text) { el.className = 'msg'; return; }
  el.textContent = text;
  el.className = 'msg show ' + (ok ? 'ok' : 'err');
}

async function loadProviders() {
  const r = await api('GET', '/v0/management/providers');
  state.providers = (r && r.data) || [];
  const sel = $('acctProvider'); sel.innerHTML = '';
  for (const p of state.providers) {
    const o = document.createElement('option');
    o.value = p.id;
    o.textContent = (p.name || p.id) + (p.enabled === false ? '（已禁用）' : '');
    sel.appendChild(o);
  }
  onProviderChange();
}
function onProviderChange() {
  const id = $('acctProvider').value;
  const hint = CRED_HINTS[id];
  if (hint) {
    const fields = Object.keys(hint);
    $('acctCreds').placeholder = JSON.stringify(
      Object.fromEntries(fields.map((f) => [f, ''])), null, 2);
    $('credHint').innerHTML = fields
      .map((f) => '<code>' + esc(f) + '</code> — ' + esc(hint[f])).join('<br>');
  } else {
    $('acctCreds').placeholder = '{"token":"..."}';
    $('credHint').textContent = '该提供商未收录提示，请参考上游 docs/providers。';
  }
}
$('acctProvider').onchange = onProviderChange;

async function loadAccounts() {
  const r = await api('GET', '/v0/management/accounts');
  state.accounts = (r && r.data) || [];
  renderAccounts();
}
function renderAccounts() {
  const el = $('acctList');
  if (!state.accounts.length) { el.innerHTML = '<div class="empty">暂无账号</div>'; return; }
  const rows = state.accounts.map((a) => {
    const prov = state.providers.find((p) => p.id === a.providerId);
    const st = a.status || 'unknown';
    const cls = st === 'active' ? 'active' : 'other';
    return '<tr>' +
      '<td><span class="dot ' + cls + '"></span>' + esc(st) + '</td>' +
      '<td>' + esc(prov ? (prov.name || prov.id) : a.providerId) + '</td>' +
      '<td>' + esc(a.name) + '</td>' +
      '<td>' + esc(a.email || '—') + '</td>' +
      '<td style="white-space:nowrap">' +
        '<button data-act="validate" data-id="' + esc(a.id) + '">校验</button> ' +
        '<button class="danger" data-act="del" data-id="' + esc(a.id) + '">删除</button>' +
      '</td></tr>';
  }).join('');
  el.innerHTML = '<table><thead><tr><th>状态</th><th>提供商</th><th>名称</th><th>邮箱</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table>';
  el.querySelectorAll('button[data-act]').forEach((b) => {
    b.onclick = async () => {
      const id = b.dataset.id; b.disabled = true;
      try {
        if (b.dataset.act === 'del') {
          if (!confirm('确定删除该账号？')) { b.disabled = false; return; }
          await api('DELETE', '/v0/management/accounts/' + encodeURIComponent(id));
          showMsg($('acctMsg'), '已删除', true);
        } else {
          const r = await api('POST', '/v0/management/accounts/' + encodeURIComponent(id) + '/validate');
          const v = r && r.data;
          showMsg($('acctMsg'),
            v && v.valid ? '校验通过' : ('校验失败：' + ((v && v.error) || '未知原因')),
            !!(v && v.valid));
        }
        await loadAccounts();
      } catch (e) { showMsg($('acctMsg'), e.message, false); }
      finally { b.disabled = false; }
    };
  });
}

async function loadKeys() {
  const r = await api('GET', '/v0/management/api-keys');
  state.keys = (r && r.data) || [];
  const el = $('keyList');
  if (!state.keys.length) { el.innerHTML = '<div class="empty">暂无密钥</div>'; return; }
  el.innerHTML = '<table><thead><tr><th>名称</th><th>状态</th><th>用量</th><th>操作</th></tr></thead><tbody>' +
    state.keys.map((k) => '<tr><td>' + esc(k.name) + '</td><td>' + (k.enabled ? '启用' : '停用') +
      '</td><td>' + esc(k.usageCount || 0) + '</td>' +
      '<td><button class="danger" data-kid="' + esc(k.id) + '">删除</button></td></tr>').join('') +
    '</tbody></table>';
  el.querySelectorAll('button[data-kid]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('确定删除该密钥？')) return;
      try {
        await api('DELETE', '/v0/management/api-keys/' + encodeURIComponent(b.dataset.kid));
        showMsg($('keyMsg'), '已删除', true); await loadKeys();
      } catch (e) { showMsg($('keyMsg'), e.message, false); }
    };
  });
}

async function loadConfig() {
  const r = await api('GET', '/v0/management/config');
  state.config = (r && r.data) || {};
  const c = state.config;
  $('cfgLb').value = c.loadBalanceStrategy || 'round-robin';
  $('cfgLog').value = c.logLevel || 'info';
  if (c.requestTimeout != null) $('cfgTimeout').value = c.requestTimeout;
  if (c.retryCount != null) $('cfgRetry').value = c.retryCount;
}

async function loadOverview() {
  let health = null;
  try { health = await (await fetch('/health')).json(); } catch (e) {}
  const accounts = state.accounts.length;
  const active = state.accounts.filter((a) => a.status === 'active').length;
  $('overview').className = '';
  $('overview').innerHTML =
    '<table><tbody>' +
    '<tr><th>代理状态</th><td>' + esc(health ? health.status : '未知') + '</td>' +
      '<th>已运行</th><td>' + (health && health.uptime ? Math.floor(health.uptime / 1000) + ' 秒' : '—') + '</td></tr>' +
    '<tr><th>账号总数</th><td>' + accounts + '</td><th>其中可用</th><td>' + active + '</td></tr>' +
    '</tbody></table>';
}

async function refreshAll() {
  try {
    await loadProviders(); await loadAccounts(); await loadKeys();
    await loadConfig();    await loadOverview();
    setBadge('已连接', 'ok');
    banner('');
  } catch (e) {
    setBadge('连接失败', 'err');
    banner('无法连接网关：' + e.message +
      '（确认容器已启动，并检查 8081 端口）', false);
  }
}

$('btnAddAccount').onclick = async () => {
  const providerId = $('acctProvider').value;
  const name = $('acctName').value.trim();
  let creds;
  try { creds = JSON.parse($('acctCreds').value || '{}'); }
  catch (e) { showMsg($('acctMsg'), '凭证不是合法 JSON', false); return; }
  if (!providerId) { showMsg($('acctMsg'), '请选择提供商', false); return; }
  if (!name) { showMsg($('acctMsg'), '请填写名称', false); return; }
  if (!Object.keys(creds).length) { showMsg($('acctMsg'), '请填写凭证', false); return; }
  const btn = $('btnAddAccount'); btn.disabled = true;
  try {
    await api('POST', '/v0/management/accounts', {
      providerId, name,
      email: $('acctEmail').value.trim() || undefined,
      credentials: creds,
    });
    showMsg($('acctMsg'), '账号已添加', true);
    $('acctCreds').value = '';
    await loadAccounts(); await loadOverview();
  } catch (e) { showMsg($('acctMsg'), e.message, false); }
  finally { btn.disabled = false; }
};

$('btnAddKey').onclick = async () => {
  const name = $('keyName').value.trim();
  if (!name) { showMsg($('keyMsg'), '请填写名称', false); return; }
  try {
    const r = await api('POST', '/v0/management/api-keys', { name });
    const k = (r && r.data) || {};
    $('dKeyVal').value = k.key || k.apiKey || JSON.stringify(k);
    $('dKey').showModal();
    $('keyName').value = '';
    await loadKeys();
  } catch (e) { showMsg($('keyMsg'), e.message, false); }
};
$('dKeyCopy').onclick = async () => {
  try { await navigator.clipboard.writeText($('dKeyVal').value); $('dKeyCopy').textContent = '已复制'; }
  catch (e) { $('dKeyVal').select(); document.execCommand('copy'); }
};
$('dKeyClose').onclick = () => { $('dKey').close(); $('dKeyCopy').textContent = '复制'; };

$('btnSaveCfg').onclick = async () => {
  const body = {
    loadBalanceStrategy: $('cfgLb').value,
    logLevel: $('cfgLog').value,
    retryCount: parseInt($('cfgRetry').value, 10),
  };
  const t = parseInt($('cfgTimeout').value, 10);
  if (t) body.requestTimeout = t;
  try {
    await api('PUT', '/v0/management/config', body);
    showMsg($('cfgMsg'), '设置已保存', true);
    await loadConfig();
  } catch (e) { showMsg($('cfgMsg'), e.message, false); }
};

$('btnRefresh').onclick = () => refreshAll();

// 直接加载，无需登录。
refreshAll();
</script>
</body>
</html>
